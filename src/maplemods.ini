; maplemods configuration. One section per feature mod. Edit and relaunch;
; no rebuild needed.

[ngs]
; Wine fixes. Set enabled=0 on Windows, where the anti-cheat works normally.
enabled=1
; Skip the fatal CPatchException the client throws when the anti-cheat can't
; start (flips the JZ guarding the throw at 0x14170eec9 to a JMP).
patch_throw=1
; Stop the map-load stack wipe that crashes the client on Play and on portals
; under Wine.
stack_walk_fix=1

[net]
; log=1      -> record every connect() destination IP:port in maplemods.log.
; redirect=1 -> send every connection to the Swordie ports (login 8484,
;               API 8483, channels 8585-8604) to `server`, so the client only
;               ever talks to your own server.
; server     -> IPv4 address of your Swordie server. Keep 127.0.0.1 when it
;               runs on this machine (or is tunnelled to it).
log=1
redirect=1
server=127.0.0.1

[window]
; Write the size the game requests for its window to maplewindow.txt, for
; maple_winsync.py (fixes window size on Hyprland).
report_size=1
